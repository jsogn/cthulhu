  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#key)"/>
  <rect y="470" width="1280" height="250" fill="url(#table)"/>
  <ellipse cx="640" cy="430" rx="210" ry="60" fill="#28465c"/>
  <rect x="540" y="270" width="200" height="160" rx="16" fill="#eef4f8"/>
